[project]
name = "tpaper-backend"
version = "1.0.0"
description = "TPaper API - 试卷转换管理后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.2.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "bleach>=6.2.0",
    "tinycss2>=1.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.1.0",
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.2",
    "python-slugify>=8.0.4",
    "Pillow>=11.0.0",
    "pydub>=0.25.1",
    "arq>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"
