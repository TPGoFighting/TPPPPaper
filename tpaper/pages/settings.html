<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPaper - API 设置</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="tp-nav">
    <nav class="tp-nav-inner">
      <a href="home.html" class="tp-logo">
        <img src="../assets/8e5cb3317fe6f13643aaed5b79adc0f5.jpg" alt="TPaper" style="height:28px;">
      </a>
      <div class="tp-nav-links">
        <a href="home.html" data-dom-id="nav-home" class="tp-nav-link">首页</a>
        <a href="convert.html" data-dom-id="nav-convert" class="tp-nav-link">转换</a>
        <a href="history.html" data-dom-id="nav-history" class="tp-nav-link">历史</a>
        <a href="settings.html" data-dom-id="nav-settings" class="tp-nav-link tp-nav-link--active">设置</a>
      </div>
    </nav>
  </header>

  <!-- ===== Main ===== -->
  <main class="tp-main">

    <!-- Page Header -->
    <div class="tp-page-header">
      <div style="display:flex;align-items:center;gap:var(--space-3);">
        <div style="width:40px;height:40px;border-radius:var(--radius-full);background:var(--color-primary-50);display:flex;align-items:center;justify-content:center;">
          <img src="../assets/__svg-5.svg" width="24" height="24" alt="" style="filter: brightness(0) saturate(100%) invert(32%) sepia(98%) saturate(1500%) hue-rotate(207deg) brightness(96%) contrast(101%);">
        </div>
        <h1 class="tp-page-title" style="margin:0;">API 设置</h1>
      </div>
      <p class="tp-page-desc">配置大模型 API 连接，用于试卷智能解析与转换</p>
    </div>

    <!-- ===== Provider Selection ===== -->
    <section class="tp-card" style="margin-bottom: var(--space-6);">
      <h2 class="tp-card-title">选择 API 服务商</h2>
      <div class="tp-provider-grid">

        <!-- OpenAI (selected) -->
        <div class="tp-provider-card tp-provider-card--selected" data-provider="openai" data-dom-id="provider-openai" onclick="selectProvider(this)">
          <div class="tp-provider-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="tp-provider-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
          </div>
          <div class="tp-provider-info">
            <span class="tp-provider-name">OpenAI</span>
            <span class="tp-provider-model">GPT-4o / GPT-4</span>
          </div>
        </div>

        <!-- Anthropic -->
        <div class="tp-provider-card" data-provider="anthropic" data-dom-id="provider-anthropic" onclick="selectProvider(this)">
          <div class="tp-provider-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="tp-provider-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12c0-2.21 1.79-4 4-4"/><path d="M12 16c2.21 0 4-1.79 4-4"/></svg>
          </div>
          <div class="tp-provider-info">
            <span class="tp-provider-name">Anthropic</span>
            <span class="tp-provider-model">Claude 3.5</span>
          </div>
        </div>

        <!-- DeepSeek -->
        <div class="tp-provider-card" data-provider="deepseek" data-dom-id="provider-deepseek" onclick="selectProvider(this)">
          <div class="tp-provider-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="tp-provider-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </div>
          <div class="tp-provider-info">
            <span class="tp-provider-name">DeepSeek</span>
            <span class="tp-provider-model">DeepSeek-V3</span>
          </div>
        </div>

        <!-- Custom -->
        <div class="tp-provider-card" data-provider="custom" data-dom-id="provider-custom" onclick="selectProvider(this)">
          <div class="tp-provider-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="tp-provider-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <div class="tp-provider-info">
            <span class="tp-provider-name">自定义</span>
            <span class="tp-provider-model">填写自定义信息</span>
          </div>
        </div>

      </div>
    </section>

    <!-- ===== Connection Config ===== -->
    <section class="tp-card" style="margin-bottom: var(--space-6);">
      <h2 class="tp-card-title">连接配置</h2>

      <!-- API Key -->
      <div class="tp-field">
        <label class="tp-label" for="api-key" data-dom-id="label-api-key">API Key</label>
        <div class="tp-input-wrap">
          <input id="api-key" data-dom-id="input-api-key" type="password" class="tp-input" placeholder="sk-xxxxxxxxxxxxxxxx" value="sk-demo-key-sample-xxxxx" autocomplete="off">
          <button type="button" class="tp-eye-btn" aria-label="显示或隐藏密码" data-dom-id="btn-toggle-key" onclick="toggleApiKey()">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="tp-field-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>密钥仅存储在本地设备，不会上传至任何服务器</span>
        </div>
      </div>

      <!-- Base URL -->
      <div class="tp-field">
        <label class="tp-label" for="base-url" data-dom-id="label-base-url">Base URL</label>
        <input id="base-url" data-dom-id="input-base-url" type="url" class="tp-input" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
      </div>

      <!-- Model -->
      <div class="tp-field">
        <label class="tp-label" for="model-name" data-dom-id="label-model">模型</label>
        <input id="model-name" data-dom-id="input-model" type="text" class="tp-input" placeholder="gpt-4o" value="gpt-4o">
        <div class="tp-chips">
          <button type="button" class="tp-chip tp-chip--active" data-dom-id="chip-gpt-4o" onclick="selectModel(this, 'gpt-4o')">gpt-4o</button>
          <button type="button" class="tp-chip" data-dom-id="chip-gpt-4o-mini" onclick="selectModel(this, 'gpt-4o-mini')">gpt-4o-mini</button>
          <button type="button" class="tp-chip" data-dom-id="chip-claude" onclick="selectModel(this, 'claude-3.5-sonnet')">claude-3.5-sonnet</button>
          <button type="button" class="tp-chip" data-dom-id="chip-deepseek" onclick="selectModel(this, 'deepseek-chat')">deepseek-chat</button>
        </div>
      </div>
    </section>

    <!-- ===== Advanced Options (expanded) ===== -->
    <section class="tp-card tp-card--collapsible" style="margin-bottom: var(--space-6);">
      <div class="tp-collapse-header tp-collapse-header--open" data-dom-id="btn-toggle-advanced" onclick="toggleAdvanced()">
        <h2 class="tp-card-title" style="margin:0;">高级选项</h2>
        <svg class="tp-collapse-arrow tp-collapse-arrow--open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="tp-collapse-body tp-collapse-body--open" id="advanced-body">
        <div class="tp-collapse-inner">

          <!-- Timeout -->
          <div class="tp-field">
            <label class="tp-label tp-label--row" for="timeout">
              <span data-dom-id="label-timeout">请求超时</span>
              <span class="tp-label-value">60 秒</span>
            </label>
            <input id="timeout" data-dom-id="input-timeout" type="number" class="tp-input tp-input--number" value="60" min="10" max="300" step="10">
          </div>

          <!-- Max Tokens -->
          <div class="tp-field">
            <label class="tp-label tp-label--row" for="max-tokens">
              <span data-dom-id="label-max-tokens">最大 Token</span>
              <span class="tp-label-value">4096</span>
            </label>
            <input id="max-tokens" data-dom-id="input-max-tokens" type="number" class="tp-input tp-input--number" value="4096" min="256" max="128000" step="256">
          </div>

          <!-- Temperature -->
          <div class="tp-field">
            <label class="tp-label tp-label--row" for="temperature">
              <span data-dom-id="label-temperature">Temperature</span>
              <span class="tp-label-value" id="temp-display" style="color:var(--color-primary);">0.7</span>
            </label>
            <input id="temperature" data-dom-id="input-temperature" type="range" min="0" max="2" step="0.1" value="0.7" oninput="document.getElementById('temp-display').textContent=this.value" class="tp-range">
            <div class="tp-range-labels">
              <span>0 (精确)</span>
              <span>2 (创意)</span>
            </div>
          </div>

          <!-- System Prompt -->
          <div class="tp-field">
            <label class="tp-label" for="system-prompt" data-dom-id="label-system-prompt">System Prompt</label>
            <textarea id="system-prompt" data-dom-id="input-system-prompt" class="tp-textarea" placeholder="你是一个试卷解析助手..." rows="3"></textarea>
          </div>

        </div>
      </div>
    </section>

    <!-- ===== Success Toast ===== -->
    <div class="tp-toast tp-toast--success" id="test-toast" data-dom-id="toast-success" style="margin-bottom: var(--space-6);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <div>
        <span class="tp-toast-title">连接成功</span>
        <span class="tp-toast-desc">模型 gpt-4o 响应正常，延迟 320ms</span>
      </div>
    </div>

    <!-- ===== Action Buttons ===== -->
    <div class="tp-actions">
      <button type="button" class="tp-btn tp-btn--outlined" data-dom-id="btn-test" onclick="testConnection()">
        <img src="../assets/__svg-4.svg" width="18" height="18" alt="" style="filter: brightness(0) invert(1);">
        测试连接
      </button>
      <button type="button" class="tp-btn tp-btn--filled" data-dom-id="btn-save">保存设置</button>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="tp-footer">
    <p>TPaper &middot; AI 试卷转换工具</p>
  </footer>

  <!-- ===== Scripts ===== -->
  <script>
    function toggleApiKey() {
      var input = document.getElementById('api-key');
      var openIcon = input.parentElement.querySelector('.eye-open');
      var closedIcon = input.parentElement.querySelector('.eye-closed');
      if (input.type === 'password') {
        input.type = 'text';
        openIcon.style.display = 'none';
        closedIcon.style.display = 'block';
      } else {
        input.type = 'password';
        closedIcon.style.display = 'none';
        openIcon.style.display = 'block';
      }
    }

    function selectModel(chip, model) {
      var chips = document.querySelectorAll('.tp-chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.remove('tp-chip--active');
      }
      chip.classList.add('tp-chip--active');
      document.getElementById('model-name').value = model;
    }

    function selectProvider(card) {
      var cards = document.querySelectorAll('.tp-provider-card');
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('tp-provider-card--selected');
      }
      card.classList.add('tp-provider-card--selected');
    }

    function toggleAdvanced() {
      var header = document.querySelector('.tp-collapse-header');
      var body = document.getElementById('advanced-body');
      var arrow = document.querySelector('.tp-collapse-arrow');
      header.classList.toggle('tp-collapse-header--open');
      body.classList.toggle('tp-collapse-body--open');
      arrow.classList.toggle('tp-collapse-arrow--open');
    }

    function testConnection() {
      var toast = document.getElementById('test-toast');
      toast.style.display = 'flex';
      toast.style.animation = 'tp-toast-in 0.3s ease-out';
    }
  </script>

  <!-- ===== Styles ===== -->
  <style>
    /* Reset & Base */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Geist', 'Noto Sans SC', var(--font-family-base);
      font-size: var(--font-size-base);
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
    }

    /* Nav */
    .tp-nav { position: sticky; top: 0; z-index: 50; background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-light); }
    .tp-nav-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--space-6); height: var(--nav-height); display: flex; align-items: center; justify-content: space-between; }
    .tp-logo { text-decoration: none; font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 1px; }
    .tp-logo-letter { transition: opacity var(--transition-fast); }
    .tp-logo:hover .tp-logo-letter { opacity: 0.85; }
    .tp-nav-links { display: flex; gap: var(--space-8); align-items: center; }
    .tp-nav-link { position: relative; font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-secondary); text-decoration: none; padding: var(--space-3) 0; transition: color var(--transition-fast); }
    .tp-nav-link:hover { color: var(--color-text-primary); }
    .tp-nav-link--active { color: var(--color-text-primary); font-weight: 600; }
    .tp-nav-link--active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; border-radius: var(--radius-full); background: var(--color-primary); }

    /* Main */
    .tp-main { max-width: 640px; margin: 0 auto; padding: var(--space-10) var(--space-5) var(--space-12); }

    /* Page Header */
    .tp-page-header { margin-bottom: var(--space-8); }
    .tp-page-title { font-size: var(--text-2xl); font-weight: 700; margin: 0 0 var(--space-2) 0; line-height: var(--leading-tight); color: var(--color-text-primary); }
    .tp-page-desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: 0; line-height: var(--leading-snug); }

    /* Card */
    .tp-card { background: var(--color-bg-surface); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: var(--shadow-xs); }
    .tp-card-title { font-size: var(--font-size-base); font-weight: 600; margin: 0 0 var(--space-5) 0; color: var(--color-text-primary); }

    /* Provider Grid */
    .tp-provider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
    .tp-provider-card { position: relative; background: var(--color-bg-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); transition: border-color var(--transition-normal), box-shadow var(--transition-normal), background var(--transition-normal); }
    .tp-provider-card:hover { border-color: var(--color-primary-200); box-shadow: var(--shadow-sm); }
    .tp-provider-card--selected { border-color: var(--color-primary); background: var(--color-primary-50); }
    .tp-provider-card--selected:hover { border-color: var(--color-primary); }
    .tp-provider-check { position: absolute; top: var(--space-2); right: var(--space-2); width: 22px; height: 22px; border-radius: var(--radius-full); background: var(--color-primary); color: #fff; display: none; align-items: center; justify-content: center; }
    .tp-provider-card--selected .tp-provider-check { display: flex; }
    .tp-provider-icon { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--color-bg-secondary); color: var(--color-text-secondary); transition: background var(--transition-fast), color var(--transition-fast); }
    .tp-provider-card--selected .tp-provider-icon { background: var(--color-primary); color: #fff; }
    .tp-provider-info { display: flex; flex-direction: column; gap: 2px; }
    .tp-provider-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text-primary); }
    .tp-provider-model { font-size: var(--font-size-xs); color: var(--color-text-tertiary); }

    /* Form Fields */
    .tp-field { margin-bottom: var(--space-6); }
    .tp-field:last-child { margin-bottom: 0; }
    .tp-label { display: block; font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-primary); margin-bottom: var(--space-2); }
    .tp-label--row { display: flex; align-items: center; justify-content: space-between; }
    .tp-label-value { font-size: var(--font-size-sm); font-weight: 400; color: var(--color-text-secondary); }
    .tp-input { width: 100%; height: 44px; padding: 0 var(--space-4); font-size: var(--font-size-sm); font-family: 'Geist', 'Noto Sans SC', var(--font-family-base); color: var(--color-text-primary); background: var(--color-bg-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); outline: none; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); box-sizing: border-box; }
    .tp-input::placeholder { color: var(--color-text-tertiary); }
    .tp-input:hover { border-color: var(--color-border-hover); }
    .tp-input:focus { border-color: var(--color-border-focus); box-shadow: 0 0 0 3px var(--color-primary-lighter); }
    .tp-input-wrap { position: relative; }
    .tp-input-wrap .tp-input { padding-right: 48px; }
    .tp-eye-btn { position: absolute; right: var(--space-3); top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); padding: var(--space-1); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); transition: color var(--transition-fast), background var(--transition-fast); }
    .tp-eye-btn:hover { color: var(--color-text-secondary); background: var(--color-bg-hover); }
    .tp-field-hint { display: flex; align-items: center; gap: var(--space-1); margin-top: var(--space-2); }

    /* Chips */

    .tp-chip--active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .tp-chip--active:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }

    /* Collapsible */
    .tp-card--collapsible { padding: 0; }
    .tp-collapse-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-6) var(--space-8); cursor: pointer; user-select: none; border-radius: var(--radius-lg); transition: background var(--transition-fast); }

    .tp-collapse-header .tp-card-title { margin-bottom: 0; }
    .tp-collapse-arrow { flex-shrink: 0; transition: transform var(--transition-normal); }
    .tp-collapse-arrow--open { transform: rotate(180deg); }
    .tp-collapse-body { max-height: 0; overflow: hidden; transition: max-height var(--transition-slow); }
    .tp-collapse-body--open { max-height: 600px; }
    .tp-collapse-inner { padding: var(--space-2) var(--space-8) var(--space-8); }

    /* Range Slider */
    .tp-range { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: var(--radius-full); background: var(--color-border); outline: none; margin-top: var(--space-1); }
    .tp-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--color-primary); cursor: pointer; border: none; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition-fast); }
    .tp-range::-webkit-slider-thumb:hover { box-shadow: var(--shadow-md); }
    .tp-range::-moz-range-thumb { width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--color-primary); cursor: pointer; border: none; }
    .tp-range-labels { display: flex; justify-content: space-between; margin-top: var(--space-2); }
    .tp-range-labels span { font-size: var(--font-size-xs); color: var(--color-text-tertiary); }

    /* Textarea */
    .tp-textarea { width: 100%; min-height: 88px; padding: var(--space-3) var(--space-4); font-size: var(--font-size-sm); font-family: 'Geist', 'Noto Sans SC', var(--font-family-base); color: var(--color-text-primary); background: var(--color-bg-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); outline: none; resize: vertical; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); box-sizing: border-box; }
    .tp-textarea::placeholder { color: var(--color-text-tertiary); }
    .tp-textarea:hover { border-color: var(--color-border-hover); }
    .tp-textarea:focus { border-color: var(--color-border-focus); box-shadow: 0 0 0 3px var(--color-primary-lighter); }

    /* Buttons */
    .tp-actions { display: flex; gap: var(--space-3); align-items: center; }
    .tp-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 44px; padding: 0 var(--space-8); font-size: var(--font-size-sm); font-weight: 600; font-family: 'Geist', 'Noto Sans SC', var(--font-family-base); border-radius: var(--radius-xl); cursor: pointer; transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast), transform 100ms ease; }
    .tp-btn:active { transform: scale(0.98); }
    .tp-btn--filled { background: var(--color-primary); color: #fff; border: none; box-shadow: var(--shadow-sm); }
    .tp-btn--filled:hover { background: var(--color-primary-dark); box-shadow: var(--shadow-md); }
    .tp-btn--outlined { background: var(--color-bg-surface); color: var(--color-primary); border: 1.5px solid var(--color-primary); }
    .tp-btn--outlined:hover { background: var(--color-primary-50); }

    /* Toast */
    .tp-toast { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-radius: var(--radius-sm); animation: tp-toast-in 0.3s ease-out; }
    .tp-toast--success { background: var(--color-success-bg); border: 1px solid var(--color-success); color: var(--color-success-text); }
    .tp-toast-title { display: block; font-size: var(--font-size-sm); font-weight: 600; }
    .tp-toast-desc { display: block; font-size: var(--font-size-xs); opacity: 0.85; margin-top: 2px; }
    @keyframes tp-toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Footer */
    .tp-footer { text-align: center; padding: var(--space-8) var(--space-5); border-top: 1px solid var(--color-border-light); }
    .tp-footer p { font-size: var(--font-size-xs); color: var(--color-text-tertiary); margin: 0; }

    /* Responsive */
    @media (max-width: 640px) {
      .tp-main { padding: var(--space-6) var(--space-4) var(--space-8); }
      .tp-card { padding: var(--space-5); }

    }
    @media (max-width: 480px) {

      .tp-actions .tp-btn { width: 100%; }
    }
  </style>
