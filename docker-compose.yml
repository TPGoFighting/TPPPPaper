# TPaper - Docker Compose 部署
# 对应 SPEC 第 9、20 节
#
# 启动: docker compose up -d
# 首次需配置 .env（参考 backend/.env.example）

services:
  # ── 数据库 ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tpaper
      POSTGRES_USER: tpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tpaper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpaper -d tpaper"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ── Redis（任务队列）──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API 服务 ──
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://tpaper:${POSTGRES_PASSWORD:-tpaper}@postgres:5432/tpaper
      REDIS_URL: redis://redis:6379/0
      MASTER_SECRET: ${MASTER_SECRET:?必须设置 MASTER_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?必须设置 SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      STORAGE_ROOT: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://tpaper.tpgofighting.top}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://tpaper.tpgofighting.top","http://localhost:3000","http://127.0.0.1:3000"]}
      DEFAULT_MODEL_PROFILE_NAME: ${DEFAULT_MODEL_PROFILE_NAME:-LongCat}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-}
      DEFAULT_MODEL_API_KEY: ${DEFAULT_MODEL_API_KEY:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-LongCat-2.0}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Worker（Celery 任务处理）──
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://tpaper:${POSTGRES_PASSWORD:-tpaper}@postgres:5432/tpaper
      REDIS_URL: redis://redis:6379/0
      MASTER_SECRET: ${MASTER_SECRET:?必须设置 MASTER_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?必须设置 SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      STORAGE_ROOT: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://tpaper.tpgofighting.top}
      DEFAULT_MODEL_PROFILE_NAME: ${DEFAULT_MODEL_PROFILE_NAME:-LongCat}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-}
      DEFAULT_MODEL_API_KEY: ${DEFAULT_MODEL_API_KEY:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-LongCat-2.0}
    volumes:
      - storage_data:/data/storage

  # ── Web 前端 ──
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  storage_data:
